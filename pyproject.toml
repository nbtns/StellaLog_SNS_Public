[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stellalog-sns-studio-public"
version = "0.1.0"
description = "StellaLogの記事からTikTok動画とX投稿文をローカル生成するWindowsアプリ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stellalog_sns = [
  "assets/fonts/*.ttf",
  "assets/fonts/*.txt",
  "assets/images/*.png",
  "assets/ranking_copy/*.json",
  "sample_data/*.json",
  "sample_data/articles/*/*/*/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
