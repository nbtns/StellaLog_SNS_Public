name: Semgrep

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  semgrep:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: >-
          docker run --rm
          -v "$PWD:/src" -w /src
          semgrep/semgrep:latest
          semgrep scan --config p/default --error --strict --metrics=off .
